# Drone Flight Analytics — full-stack Docker Compose
#
# Services:
#   db        — PostgreSQL 16 (persistent volume)
#   backend   — Spring Boot 3 API (port 8080, internal only)
#   frontend  — Nginx serving the React SPA + proxying /api/* to backend (port 80)
#
# Quick start:
#   1. cp .env.example .env  →  fill in DB_PASSWORD and JWT_SECRET
#   2. docker compose up --build
#   3. Open http://localhost
#
# To run with the built-in H2 database instead of PostgreSQL (no db service needed):
#   docker compose up --build backend frontend
#   (leave SPRING_PROFILES_ACTIVE unset so it defaults to H2)

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       droneanalytics
      POSTGRES_USER:     droneanalytics
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - drone-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droneanalytics -d droneanalytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./drone-ingestion
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST:               db
      DB_NAME:               droneanalytics
      DB_USER:               droneanalytics
      DB_PASSWORD:           ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET:            ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      WEBHOOK_ENABLED:       ${WEBHOOK_ENABLED:-false}
      WEBHOOK_URL:           ${WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Temp storage for uploads (cleared between restarts; not for persistence)
      - backend_tmp:/app/data
    networks:
      - drone-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── React + Nginx frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./drone-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - drone-net

# ── Networks & volumes ─────────────────────────────────────────────────────────
networks:
  drone-net:
    driver: bridge

volumes:
  postgres_data:
  backend_tmp:
