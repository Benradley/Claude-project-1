# Test-specific overrides — in-memory H2 so tests don't touch the dev DB file.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Use a known secret in tests
drone.jwt.secret=test-jwt-secret-key-for-unit-tests-32chars-ok
drone.jwt.expiration-seconds=3600

# Suppress noisy PDFBox font-cache output during tests
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR
