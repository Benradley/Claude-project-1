# ── Production profile — activated by SPRING_PROFILES_ACTIVE=prod ─────────────
# All sensitive values MUST be supplied via environment variables.
# See docker-compose.yml and .env.example at the repo root.

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:droneanalytics}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:droneanalytics}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Flyway — PostgreSQL-specific migration scripts ────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/postgresql

# ── H2 console (always off in prod) ───────────────────────────────────────────
spring.h2.console.enabled=false

# ── File uploads ─────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB

# ── JWT ───────────────────────────────────────────────────────────────────────
# Must be >= 32 characters. Generate with: openssl rand -base64 48
drone.jwt.secret=${JWT_SECRET}
drone.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# ── Notifications ─────────────────────────────────────────────────────────────
drone.notification.webhook.enabled=${WEBHOOK_ENABLED:false}
drone.notification.webhook.url=${WEBHOOK_URL:}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.droneanalytics=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
