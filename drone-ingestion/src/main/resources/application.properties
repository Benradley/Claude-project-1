# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── File upload limits ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB

# ── Temp storage for uploaded logs ────────────────────────────────────────────
drone.upload.temp-dir=${java.io.tmpdir}/drone-uploads

# ── H2 file-based database (dev) ──────────────────────────────────────────────
# Data persists in ./data/drone-analytics.mv.db between restarts.
# Switch to PostgreSQL in production — see comments at bottom of file.
spring.datasource.url=jdbc:h2:file:./data/drone-analytics;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Flyway manages the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── H2 console (enable only for local debugging) ──────────────────────────────
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ── JWT ───────────────────────────────────────────────────────────────────────
# Override drone.jwt.secret with a strong random value in production (env var).
# Must be >= 32 characters for HS256.
drone.jwt.secret=drone-analytics-jwt-secret-key-please-override-in-prod-32chars
drone.jwt.expiration-seconds=86400

# ── Notification settings (override via env vars in production) ───────────────
drone.notification.webhook.enabled=false
drone.notification.webhook.url=

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.droneanalytics=INFO

# ── PostgreSQL (production) — uncomment and set env vars to switch ────────────
