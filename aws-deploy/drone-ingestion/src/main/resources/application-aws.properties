# ── AWS Elastic Beanstalk profile ────────────────────────────────────────────
# Activate by setting this EB environment variable:
#   SPRING_PROFILES_ACTIVE = aws
#
# Uses H2 file-based storage so no RDS instance is required — keeps the app
# on the AWS free tier for portfolio use.
#
# If you need persistent production-grade storage, use application-prod.properties
# instead (PostgreSQL via RDS) and set SPRING_PROFILES_ACTIVE=prod.

# ── H2 file database ──────────────────────────────────────────────────────────
# /tmp is writable on EB; the file persists across app restarts within the
# same EC2 instance.  If the instance is replaced (scale-in/AMI update) the
# database resets — acceptable for a portfolio / demo app.
spring.datasource.url=jdbc:h2:file:/tmp/drone-analytics;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Flyway disabled — JPA's ddl-auto=update manages the schema for H2
spring.flyway.enabled=false

# H2 web console disabled in all deployed environments
spring.h2.console.enabled=false

# ── JWT (required) ────────────────────────────────────────────────────────────
# Set JWT_SECRET in EB → Configuration → Software → Environment properties.
# Minimum 32 characters; use a random string (e.g. openssl rand -hex 32).
drone.jwt.secret=${JWT_SECRET}
drone.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# ── Notifications (optional) ─────────────────────────────────────────────────
drone.notification.webhook.enabled=${WEBHOOK_ENABLED:false}
drone.notification.webhook.url=${WEBHOOK_URL:}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.droneanalytics=WARN
logging.level.org.springframework.security=WARN
