server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── React SPA routing ─────────────────────────────────────────────────────
    # All non-asset requests fall back to index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → Spring Boot backend ──────────────────────────────────────
    # The backend service is named "backend" in docker-compose.yml.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large drone log uploads (up to 150 MB)
        client_max_body_size 150m;

        # Long timeout for analysis of large log files
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    # Vite fingerprints all JS/CSS bundles, so 1-year cache is safe.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "DENY"            always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "no-referrer"     always;

    # Gzip compression
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/javascript application/x-javascript image/svg+xml;
    gzip_min_length 1024;
}
