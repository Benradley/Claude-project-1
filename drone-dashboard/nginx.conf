server {
    listen 80;
    server_name _;

    # ── React SPA at /droneproject/ ───────────────────────────────────────────
    # The Vite production build uses base: '/droneproject', so all asset URLs
    # are /droneproject/assets/... and nginx maps them via alias.
    location /droneproject/ {
        alias /usr/share/nginx/html/;
        index index.html;

        # For any path under /droneproject/ that isn't a real file (React Router
        # deep links, page refreshes, etc.) fall back to index.html.
        try_files $uri $uri/ /index.html;
    }

    # Redirect bare /droneproject (no trailing slash) to /droneproject/
    location = /droneproject {
        return 301 /droneproject/;
    }

    # ── API proxy → Spring Boot backend ──────────────────────────────────────
    # The frontend calls /api/... (absolute paths from the domain root).
    # These are proxied straight to the backend regardless of the UI base path.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large drone log uploads (up to 150 MB)
        client_max_body_size 150m;

        # Long timeout for analysis of large log files
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    # Vite fingerprints all JS/CSS bundles, so a 1-year cache is safe.
    location ~* /droneproject/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        alias /usr/share/nginx/html/;
        rewrite ^/droneproject/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "DENY"            always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "no-referrer"     always;

    # Gzip compression
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/javascript application/x-javascript image/svg+xml;
    gzip_min_length 1024;
}
